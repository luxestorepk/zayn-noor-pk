<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection | NOOR Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hdr"></div>
<section class="page-title"><div class="wrap"><h1>Collection</h1><p>Apna pasandeeda suit chunein</p></div></section>
<section class="section" style="padding-top:40px">
  <div class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips">
        <button class="chip on" data-cat="All">All</button>
        <button class="chip" data-cat="Lawn">Lawn</button>
        <button class="chip" data-cat="Formal">Formal</button>
        <button class="chip" data-cat="Winter">Winter</button>
        <button class="chip" data-cat="Casual">Casual</button>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="Suit talash karein" aria-label="Search">
        <select id="sort" aria-label="Sort">
          <option value="def">Sort: Default</option>
          <option value="lo">Qeemat: kam se zyada</option>
          <option value="hi">Qeemat: zyada se kam</option>
          <option value="rt">Best rating</option>
        </select>
      </div>
    </div>
    <div class="grid" id="products"></div>
  </div>
</section>
<div id="ftr"></div>
<script src="app.js"></script>
</body>
</html>
