<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | SAHAR Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hdr"></div>
<section class="page-title"><div class="wrap"><h1>Checkout</h1><p>Apni details likhein, order WhatsApp par confirm hoga</p></div></section>
<section class="section" style="padding-top:40px">
  <div class="wrap co">
    <div>
      <form class="formcard" id="checkoutForm" novalidate>
        <h3 style="margin-bottom:16px">Delivery ki maloomat</h3>
        <div class="row2">
          <div class="field"><label for="a1">Poora naam *</label><input id="a1" name="name" autocomplete="name"><span class="err" data-e="name"></span></div>
          <div class="field"><label for="a2">Mobile number *</label><input id="a2" name="phone" type="tel" inputmode="tel" placeholder="03001234567" autocomplete="tel"><span class="err" data-e="phone"></span></div>
        </div>
        <div class="row2">
          <div class="field"><label for="a3">Email (optional)</label><input id="a3" name="email" type="email" autocomplete="email"><span class="err" data-e="email"></span></div>
          <div class="field"><label for="a4">Shehar *</label><input id="a4" name="city" list="cities" autocomplete="address-level2"><span class="err" data-e="city"></span>
            <datalist id="cities"><option>Karachi</option><option>Lahore</option><option>Islamabad</option><option>Rawalpindi</option><option>Faisalabad</option><option>Multan</option><option>Peshawar</option><option>Quetta</option><option>Sialkot</option><option>Gujranwala</option><option>Hyderabad</option></datalist></div>
        </div>
        <div class="field"><label for="a5">Poora address *</label><textarea id="a5" name="address" rows="3" placeholder="Ghar number, gali ya street, mohalla ya area, landmark"></textarea><span class="err" data-e="address"></span></div>
        <div class="field"><label for="a6">Koi note (optional)</label><input id="a6" name="note"></div>
        <h3 style="margin:8px 0 12px">Payment ka tareeqa</h3>
        <div class="pay">
          <label><input type="radio" name="pay" value="cod" checked> Cash on Delivery</label>
          <label><input type="radio" name="pay" value="easypaisa"> Easypaisa</label>
          <label><input type="radio" name="pay" value="jazzcash"> JazzCash</label>
        </div>
        <div class="paybox" id="payBox"></div>
        <button class="btn full" type="submit">Place order</button>
      </form>
    </div>
    <aside class="sum" id="sumBox"><h3>Order summary</h3><div id="sumItems"></div></aside>
  </div>
</section>
<div id="ftr"></div>
<script src="app.js"></script>
</body>
</html>
